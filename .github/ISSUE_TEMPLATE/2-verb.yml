name: A wrong verb form or translation
description: A conjugated form, a translation or a label that isn't right.
labels: ["verb data"]
body:
  - type: markdown
    attributes:
      value: |
        The Spanish, English, Russian and Ukrainian tables are generated by rules, so a wrong form usually hides a
        rule that needs a fix. English, español, русский or українська are all fine.
  - type: input
    id: verb
    attributes:
      label: Verb
      placeholder: tener, делать, to go…
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Tense and person
      placeholder: Pretérito · nosotros
  - type: input
    id: shown
    attributes:
      label: What the app shows
    validations:
      required: true
  - type: input
    id: right
    attributes:
      label: What's right
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source, if you have one
      description: A dictionary or grammar, or "I'm a native speaker".
